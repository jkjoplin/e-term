# Starts the custom sleep screen after the Kindle UI is up.
# A missing install stops this job. It does not stop the Kindle from booting.
start on started lab126_gui
stop on stopping lab126_gui

pre-start script
  test -f /mnt/us/extensions/custom-screensaver/start.sh || { stop; exit 0; }
  sleep 25
end script

script
  /bin/sh /mnt/us/extensions/custom-screensaver/start.sh
end script
